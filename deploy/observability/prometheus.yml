global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: capacity-api
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: capacity-sweeper
    static_configs: [{ targets: ["sweeper:8080"] }]
  - job_name: capacity-relay
    static_configs: [{ targets: ["relay:8080"] }]
